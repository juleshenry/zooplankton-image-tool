[tool.poetry]
name = "zooplankton-image-tool"
version = "0.1.8"
description = "ZIT, the premier zooplankton imaging tool"
authors = ["Julián Henry"]
readme = "README.md"
packages = [{include = "zit", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
Pillow = ">=9.1.0"
opencv-python-headless = ">=4.8.1.78"
scipy = ">=1.10.0"
numpy = ">=1.24.0"

[tool.poetry.scripts]
zit = "zit.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
